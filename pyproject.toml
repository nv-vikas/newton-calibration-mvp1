[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-calibration"
version = "0.1.0"
description = "SO-101 actuator calibration for Isaac Lab and Newton"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "huggingface-hub>=0.25",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
asset-prep = [
  "coacd==1.0.9",
  "trimesh==4.11.1",
]

[project.scripts]
newton-calibration = "newton_calibration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
